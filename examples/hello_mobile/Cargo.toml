[package]
name = "hello_mobile"
version = "0.1.0"
edition = "2024"
publish = false
description = "rgpui 移动端最小示例（1.4.0，Android 优先，iOS 预留）"

[lib]
name = "hello_mobile"
crate-type = ["cdylib", "staticlib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "hello_mobile"
path = "src/main.rs"

[dependencies]
rgpui.workspace = true
rgpui-platform.workspace = true
log.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
rgpui-android.workspace = true
android-activity = { version = "0.6", features = ["native-activity"] }
android_logger = "0.15"

[target.'cfg(target_os = "ios")'.dependencies]
rgpui-ios.workspace = true
