[package]
name = "rgpui_term_basic"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "basic"
path = "src/main.rs"

# 外接 IO 后端（new_external）演示：无本地 PTY，自喂远端字节流
[[bin]]
name = "external_io"
path = "src/bin/external_io.rs"

[dependencies]
log.workspace = true
rgpui-term.workspace = true
rgpui.workspace = true
rgpui-platform.workspace = true
smallvec = "1"
serde.workspace = true
dirs.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.26"
objc = "0.2"

