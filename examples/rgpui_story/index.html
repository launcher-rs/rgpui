<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=0" />
        <title>rgpui 组件示例大全（Web）</title>
        <link data-trunk rel="rust" data-bin="rgpui_story" data-bindgen-target="web" data-keep-debug data-wasm-opt="0" />
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            html,
            body {
                margin: 0;
                height: 100%;
            }
            body {
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen,
                    Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
                overflow: hidden;
                width: 100vw;
                height: 100vh;
                background: #fff;
                color: #000;
            }
            canvas {
                display: block;
                width: 100%;
                height: 100%;
                touch-action: none;
                outline: none;
                -webkit-user-select: none;
                user-select: none;
            }
            /* 首帧渲染前的加载提示，canvas 出现后由脚本移除 */
            #loading {
                position: fixed;
                z-index: 1;
                pointer-events: none;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                text-align: center;
            }
            .spinner {
                border: 4px solid rgba(0, 0, 0, 0.1);
                border-left-color: #000;
                border-radius: 50%;
                width: 40px;
                height: 40px;
                animation: spin 1s linear infinite;
                margin: 0 auto 16px;
            }
            @keyframes spin {
                to {
                    transform: rotate(360deg);
                }
            }
            .error {
                color: #d32f2f;
                padding: 20px;
                text-align: center;
            }
        </style>
        <script>
            // 当 gpui 创建 canvas（首帧渲染）后，移除加载提示。
            (function () {
                function hideLoading() {
                    const el = document.getElementById('loading');
                    if (el) el.remove();
                }
                function checkCanvas() {
                    if (document.querySelector('canvas')) {
                        hideLoading();
                        return true;
                    }
                    return false;
                }
                if (document.readyState !== 'loading') {
                    if (!checkCanvas()) {
                        new MutationObserver(checkCanvas).observe(document.body, {
                            childList: true,
                        });
                    }
                } else {
                    document.addEventListener('DOMContentLoaded', function () {
                        if (!checkCanvas()) {
                            new MutationObserver(checkCanvas).observe(document.body, {
                                childList: true,
                            });
                        }
                    });
                }
            })();
        </script>
    </head>
    <body>
        <div id="loading">
            <div class="spinner"></div>
            <p>正在加载 rgpui 组件示例大全…</p>
        </div>
    </body>
</html>
