[package]
name = "rgpui_story"
description = "rgpui 组件示例大全：通过侧边栏导航分类展示所有组件的用法"
version = "0.1.0"
edition = "2024"
publish = false
autobins = false

[[bin]]
name = "rgpui_story"
path = "src/main.rs"
test = false

[dependencies]
rgpui = { workspace = true, features = [
    "charts",
    "effects",
    "qr-code",
    "dom-backend",
] }
rgpui-platform.workspace = true
rgpui-markdown = { workspace = true, features = ["latex", "mermaid"] }
serde = { workspace = true, features = ["derive"] }
tempfile.workspace = true

[lints]
workspace = true