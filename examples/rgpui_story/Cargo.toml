[package]
name = "rgpui_story"
description = "rgpui 组件示例大全：通过侧边栏导航分类展示所有组件的用法"
version = "0.1.0"
edition = "2024"
publish = false
autobins = false

[[bin]]
name = "rgpui_story"
path = "src/main.rs"
test = false

[dependencies]
rgpui = { workspace = true, features = [
    "charts",
    "effects",
    "qr-code",
    "dom-backend",
    "reqwest",
    "input-latency-histogram",
    "editor",
    "tree-sitter",
    "tree-sitter-json",
    "tree-sitter-toml",
    "tree-sitter-javascript",
    "tree-sitter-python",
    "tree-sitter-go",
    "ribbon",
    "viewport",
    "spreadsheet",
    "document",
    "control-channel",
    "screen-capture",
] }
rgpui-platform.workspace = true
rgpui-markdown = { workspace = true, features = ["latex", "mermaid"] }
serde = { workspace = true, features = ["derive"] }
anyhow.workspace = true
lsp-types.workspace = true
rand.workspace = true
futures.workspace = true
lyon.workspace = true
serde_json.workspace = true
log.workspace = true
env_logger.workspace = true

[lints]
workspace = true