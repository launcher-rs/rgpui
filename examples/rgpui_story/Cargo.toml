[package]
name = "rgpui_story"
description = "rgpui 组件示例大全：通过侧边栏导航分类展示所有组件的用法"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
rgpui = { workspace = true, features = [
    "charts",
    "effects",
    "qr-code",
    "dom-backend",
    "tree-sitter",
    "tree-sitter-json",
    "tree-sitter-toml",
    "tree-sitter-javascript",
    "tree-sitter-python",
] }
rgpui-platform.workspace = true
rgpui-markdown = { workspace = true, features = ["latex", "mermaid", "syntax-highlight"] }
serde = { workspace = true, features = ["derive"] }
tempfile.workspace = true

[lints]
workspace = true