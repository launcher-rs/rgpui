[package]
name = "rgpui_story"
description = "rgpui 组件示例大全：通过侧边栏导航分类展示所有组件的用法"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow.workspace = true
rgpui = { workspace = true, features = ["charts", "effects", "qr-code", "dom-backend"] }
rgpui-platform.workspace = true
web-sys = { version = "0.3", features = ["Window", "Document"] }

[lints]
workspace = true