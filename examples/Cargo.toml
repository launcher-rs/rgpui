[workspace]
members = [
    # ---- 已有示例 ----
    "desktop_pet",
    "desktop_pet_3d",
    "extended_components",
    "rgpui_story",
    "rgpui_term_basic",
    "rgpui_term_integration",
    "screen_capture",
    # ---- 从 crates/rgpui/examples/ 迁入的简单示例 ----
    "active_state_bug",
    "a11y",
    "anchor",
    "animation",
    "charts",
    "daemon_app",
    "data_table",
    "drag_drop",
    "effects",
    "focus_visible",
    "gif_viewer",
    "gradient",
    "grid_layout",
    "hello_world",
    "image_gallery",
    "image_loading",
    "image",
    "input_latency",
    "input",
    "layer_shell",
    "list_example",
    "mouse_pressure",
    "move_entity_between_windows",
    "on_window_close_quit",
    "opacity",
    "ownership_post",
    "painting",
    "paths_bench",
    "pattern",
    "popover",
    "qr_code",
    "scrollable",
    "set_menus",
    "shadow",
    "svg",
    "tab_stop",
    "testing",
    "text_layout",
    "text_wrapper",
    "text",
    "theme",
    "tokio_example",
    "transparent",
    "tray_simple",
    "tray",
    "tree",
    "uniform_list",
    "window_movable",
    "window_positioning",
    "window_shadow",
    "window",
    # ---- 多文件示例 ----
    "view_example",
]
resolver = "3"

[workspace.package]
edition = "2024"
publish = false

# ---- rgpui 内部 crate（路径依赖）----
[workspace.dependencies.rgpui]
path = "../crates/rgpui"

[workspace.dependencies.rgpui-platform]
path = "../crates/rgpui-platform"

[workspace.dependencies.rgpui-character]
path = "../crates/rgpui-character"

[workspace.dependencies.rgpui-3d]
path = "../crates/rgpui-3d"

[workspace.dependencies.rgpui-term]
path = "../crates/rgpui-term"

[workspace.dependencies.rgpui-markdown]
path = "../crates/rgpui-markdown"

[workspace.dependencies.rgpui-wgpu]
path = "../crates/rgpui-wgpu"

# ---- 第三方依赖 ----
[workspace.dependencies]
anyhow = "1.0.86"
log = { version = "0.4", features = ["kv_unstable_serde", "serde"] }
env_logger = "0.11"
serde = { version = "1.0.221", features = ["derive", "rc"] }
dirs = "6.0"
image = "0.25.1"
smallvec = { version = "1.6", features = ["union", "const_new"] }
portable-pty = "0.9"
web-sys = "0.3"
smol = "2.0"
cocoa = "0.26.1"
objc = "0.2"
unicode-segmentation = "1.13"
rand = "0.10"
futures = "0.3"
lyon = { version = "1.0", features = ["extra"] }
hdrhistogram = "7"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time"] }

[workspace.lints.rust]
unexpected_cfgs = { level = "allow" }

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
