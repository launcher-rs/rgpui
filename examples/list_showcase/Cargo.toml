[package]
name = "list_showcase"
version = "0.1.0"
edition = "2024"
publish = false
description = "列表与表格展示：虚拟列表/等高列表/数据表格/深层级压力测试"

autobins = false

[[bin]]
name = "list_showcase"
path = "src/main.rs"
test = false

[[bin]]
name = "data_table"
path = "src/bin/data_table.rs"
test = false

[[bin]]
name = "list_example"
path = "src/bin/list_example.rs"
test = false

[[bin]]
name = "tree"
path = "src/bin/tree.rs"
test = false

[[bin]]
name = "uniform_list"
path = "src/bin/uniform_list.rs"
test = false

[dependencies]
rgpui.workspace = true
rgpui-platform.workspace = true
rand.workspace = true

[dev-dependencies]
criterion.workspace = true
# bench 目标需要 `BenchAppContext` / `#[rgpui::bench]` 的运行时支撑。
rgpui = { workspace = true, features = ["bench"] }
# `#[rgpui::bench]` 生成的无头渲染器入口由平台的 test-support 门控提供。
rgpui-platform = { workspace = true, features = ["test-support"] }

[lints]
workspace = true

[[bench]]
name = "text_shaping"
harness = false

[[bench]]
name = "scene_build"
harness = false

[[bench]]
name = "text_wrap"
harness = false
