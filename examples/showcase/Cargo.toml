[package]
name = "showcase"
version = "0.1.0"
edition = "2024"
publish = false
description = "rgpui 核心组件与能力示例集合，按功能一个 bin（cargo run -p showcase --bin <名称>）"

# 显式登记全部 bin：带 feature 门控的 bin 需要 required-features，故关闭自动发现。
autobins = false

[dependencies]
rgpui.workspace = true
rgpui-platform.workspace = true
rgpui-markdown.workspace = true
anyhow.workspace = true
env_logger.workspace = true
log.workspace = true
serde_json.workspace = true
unicode-segmentation.workspace = true
lyon.workspace = true
hdrhistogram = { workspace = true, optional = true }
lsp-types = { workspace = true, optional = true }

[dev-dependencies]
rgpui = { workspace = true, features = ["test-support"] }
rand.workspace = true
futures.workspace = true

[features]
# showcase 覆盖全部组件与能力，套件基座默认开启，保证 workspace 的
# check/test 都会编译并测试这些模块。
default = [
    "ribbon",
    "viewport",
    "spreadsheet",
    "document",
    "control-channel",
    "screen-capture",
]
# Ribbon 套件基座组件（命令注册表 / Ribbon / 按键提示 / 快速访问工具栏）。
ribbon = ["rgpui/ribbon"]
# 视口与标尺基座组件（画布视口 / 刻度与对齐参考线）。
viewport = ["rgpui/viewport"]
# 电子表格基座组件（公式栏 / 电子表格网格）。
spreadsheet = ["rgpui/spreadsheet"]
# 文档套件基座组件（分页画布）。
document = ["rgpui/document"]
# 控制通道 + MCP 服务端（外部自动化 / AI 客户端调命令）。
control-channel = ["rgpui/control-channel"]
# 图表组件（BarChart/LineChart/PieChart 等）。
charts = ["rgpui/charts"]
# 封装动效（Aurora/Confetti/Marquee/Ripple/Shimmer 等）。
effects = ["rgpui/effects"]
# 二维码组件。
qr-code = ["rgpui/qr-code"]
# 文本差异查看器。
diff = ["rgpui/diff"]
# 输入延迟直方图统计。
input-latency = ["rgpui/input-latency-histogram", "dep:hdrhistogram"]
# 屏幕取色（吸管）；`color_picker` bin 里的吸管按钮在该 feature 下编译。
screen-capture = ["rgpui/screen-capture"]
# 编辑器（含 tree-sitter 高亮、LSP、片段、inlay 等）。
editor = [
    "rgpui/editor",
    "rgpui/tree-sitter",
    "rgpui/tree-sitter-json",
    "rgpui/tree-sitter-toml",
    "rgpui/tree-sitter-javascript",
    "rgpui/tree-sitter-python",
    "rgpui/tree-sitter-go",
    "dep:lsp-types",
]
# 元素检查器（release 下需要显式开启）。
inspector = ["rgpui/inspector"]

