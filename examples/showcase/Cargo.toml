[package]
name = "showcase"
version = "0.1.0"
edition = "2024"
publish = false
description = "rgpui 核心组件与能力示例集合，按功能一个 bin（cargo run -p showcase --bin <名称>）"

# 显式登记全部 bin：带 feature 门控的 bin 需要 required-features，故关闭自动发现。
autobins = false

[dependencies]
rgpui.workspace = true
rgpui-platform.workspace = true
anyhow.workspace = true
env_logger.workspace = true
log.workspace = true
serde_json.workspace = true
unicode-segmentation.workspace = true
lyon.workspace = true
hdrhistogram = { workspace = true, optional = true }
lsp-types = { workspace = true, optional = true }

[dev-dependencies]
rgpui = { workspace = true, features = ["test-support"] }
rand.workspace = true
futures.workspace = true

[features]
default = []
# 图表组件（BarChart/LineChart/PieChart 等）。
charts = ["rgpui/charts"]
# 封装动效（Aurora/Confetti/Marquee/Ripple/Shimmer 等）。
effects = ["rgpui/effects"]
# 二维码组件。
qr-code = ["rgpui/qr-code"]
# 输入延迟直方图统计。
input-latency = ["rgpui/input-latency-histogram", "dep:hdrhistogram"]
# 编辑器（含 tree-sitter 高亮、LSP、片段、inlay 等）。
editor = ["rgpui/editor", "rgpui/tree-sitter", "dep:lsp-types"]
# 元素检查器（release 下需要显式开启）。
inspector = ["rgpui/inspector"]

# ---------- 通用 ----------
[[bin]]
name = "hello_world"
path = "src/bin/hello_world.rs"

[[bin]]
name = "a11y"
path = "src/bin/a11y.rs"

[[bin]]
name = "active_state_bug"
path = "src/bin/active_state_bug.rs"

[[bin]]
name = "animation"
path = "src/bin/animation.rs"

[[bin]]
