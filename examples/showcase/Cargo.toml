[package]
name = "showcase"
version = "0.1.0"
edition = "2024"
publish = false
description = "rgpui 示例集合：8 个 gallery bin 覆盖全部组件与能力（-- <demo> 选具体演示）"

# 显式登记全部 bin：带 feature 门控的 bin 需要 required-features，故关闭自动发现。
autobins = false

[dependencies]
rgpui = { workspace = true, features = ["reqwest"] }
rgpui-platform.workspace = true
rgpui-markdown.workspace = true
anyhow.workspace = true
env_logger.workspace = true
log.workspace = true
serde_json.workspace = true
lyon.workspace = true
futures.workspace = true
rand.workspace = true
hdrhistogram = { workspace = true, optional = true }
lsp-types = { workspace = true, optional = true }

[features]
# 默认开启套件基座，保证 workspace 的 check/test 会编译这些模块。
default = [
    "ribbon",
    "viewport",
    "spreadsheet",
    "document",
    "control-channel",
    "screen-capture",
]
ribbon = ["rgpui/ribbon"]
viewport = ["rgpui/viewport"]
spreadsheet = ["rgpui/spreadsheet"]
document = ["rgpui/document"]
control-channel = ["rgpui/control-channel"]
charts = ["rgpui/charts"]
effects = ["rgpui/effects"]
qr-code = ["rgpui/qr-code"]
diff = ["rgpui/diff"]
input-latency = ["rgpui/input-latency-histogram", "dep:hdrhistogram"]
screen-capture = ["rgpui/screen-capture"]
editor = [
    "rgpui/editor",
    "rgpui/tree-sitter",
    "rgpui/tree-sitter-json",
    "rgpui/tree-sitter-toml",
    "rgpui/tree-sitter-javascript",
    "rgpui/tree-sitter-python",
    "rgpui/tree-sitter-go",
    "dep:lsp-types",
]
inspector = ["rgpui/inspector"]

# ---------- 8 个 gallery bin ----------
[[bin]]
name = "form_gallery"
path = "src/bin/form_gallery.rs"

[[bin]]
name = "core_gallery"
path = "src/bin/core_gallery.rs"
test = false

[[bin]]
name = "text_gallery"
path = "src/bin/text_gallery.rs"
test = false

[[bin]]
name = "creative_gallery"
path = "src/bin/creative_gallery.rs"
test = false

[[bin]]
name = "media_gallery"
path = "src/bin/media_gallery.rs"
test = false

[[bin]]
name = "suite_gallery"
path = "src/bin/suite_gallery.rs"
required-features = ["ribbon", "viewport", "spreadsheet", "document", "control-channel"]
test = false

[[bin]]
name = "visual_gallery"
path = "src/bin/visual_gallery.rs"
required-features = ["charts", "effects", "qr-code"]
test = false

[[bin]]
name = "tools_gallery"
path = "src/bin/tools_gallery.rs"
required-features = ["diff", "editor", "input-latency"]
test = false

[lints]
workspace = true
