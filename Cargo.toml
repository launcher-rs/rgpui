[workspace]
resolver = "3"

members = [
    "crates/rgpui",
    "crates/rgpui-3d",
    "crates/rgpui-character",
    "crates/rgpui-dom",
    "crates/rgpui-linux",
    "crates/rgpui-macos",
    "crates/rgpui-macros",
    "crates/rgpui-markdown",
    "crates/rgpui-platform",
    "crates/rgpui-term",
    "crates/rgpui-web",
    "crates/rgpui-wgpu",
    "crates/rgpui-windows",
    # examples
    "examples/a11y",
    "examples/active_state_bug",
    "examples/anchor",
    "examples/animation",
    "examples/charts",
    "examples/daemon_app",
    "examples/data_table",
    "examples/desktop_pet",
    "examples/desktop_pet_3d",
    "examples/drag_drop",
    "examples/effects",
    "examples/extended_components",
    "examples/focus_visible",
    "examples/gif_viewer",
    "examples/gradient",
    "examples/grid_layout",
    "examples/hello_world",
    "examples/image",
    "examples/image_gallery",
    "examples/image_loading",
    "examples/input",
    "examples/input_latency",
    "examples/layer_shell",
    "examples/list_example",
    "examples/mouse_pressure",
    "examples/move_entity_between_windows",
    "examples/on_window_close_quit",
    "examples/opacity",
    "examples/ownership_post",
    "examples/painting",
    "examples/paths_bench",
    "examples/pattern",
    "examples/popover",
    "examples/qr_code",
    "examples/rgpui_story",
    "examples/rgpui_term_basic",
    "examples/rgpui_term_integration",
    "examples/screen_capture",
    "examples/scrollable",
    "examples/set_menus",
    "examples/shadow",
    "examples/svg",
    "examples/tab_stop",
    "examples/testing",
    "examples/text",
    "examples/text_layout",
    "examples/text_wrapper",
    "examples/theme",
    "examples/tokio_example",
    "examples/transparent",
    "examples/tray",
    "examples/tray_simple",
    "examples/tree",
    "examples/uniform_list",
    "examples/view_example",
    "examples/window",
    "examples/window_movable",
    "examples/window_positioning",
    "examples/window_shadow",
]

[workspace.package]
edition = "2024"
publish = true
license = "Apache-2.0"
version = "1.0.2"

# ==================== 工作区依赖 ====================
[workspace.dependencies]
# ---- 内部 crates ----
rgpui-macros = { path = "crates/rgpui-macros" ,version = "1.0.2"}
rgpui = { path = "crates/rgpui", default-features = false ,version = "1.0.2"}
rgpui-wgpu = { path = "crates/rgpui-wgpu",version = "1.0.2" }
rgpui-linux = { path = "crates/rgpui-linux", default-features = false,version = "1.0.2" }
rgpui-windows = { path = "crates/rgpui-windows", default-features = false ,version = "1.0.2"}
rgpui-macos = { path = "crates/rgpui-macos", default-features = false ,version = "1.0.2"}
rgpui-web = { path = "crates/rgpui-web", default-features = false, version = "1.0.2" }
rgpui-platform = { path = "crates/rgpui-platform", default-features = false,version = "1.0.2" }

rgpui-dom = { path = "crates/rgpui-dom", version = "1.0.2" }

rgpui-character = {path = "crates/rgpui-character",version = "1.0.2"}
rgpui-3d = {path = "crates/rgpui-3d",version = "1.0.2"}
rgpui-term = {path = "crates/rgpui-term", version = "1.0.2"}
rgpui-markdown = {path = "crates/rgpui-markdown", version = "1.0.2"}


# ---- 辅助功能（AccessKit） ----
accesskit = "0.24.0"
accesskit_macos = "0.26.0"
accesskit_unix = "0.21.0"
accesskit_windows = "0.32.1"

# ---- 错误处理 ----
# 错误处理库
anyhow = "1.0.104"
# 自定义错误类型派生
thiserror = "2.0.20"
# 堆栈回溯
backtrace = "0.3"
# Markdown 解析（rgpui-markdown 使用）
pulldown-cmark = "0.13"

# ---- 异步与并发 ----
# 异步运行时（用于 async-tar）
async-std = { version = "1.13", features = ["unstable"] }
# 异步通道
async-channel = "2.5.0"
# 异步文件系统操作
async-fs = "2.2"
# 异步任务调度
async-task = "4.7"
# 异步压缩
async-compression = { version = "0.4", features = ["bzip2", "gzip", "futures-io"] }
# 异步 tar 归档
async-tar = "0.6"
# 异步 zip
async_zip = { version = "0.0.19", features = ["deflate", "deflate64"] }
# 异步 Futures 工具
futures = "0.3.34"
# 并发 Futures 组合子
futures-concurrency = "7.7.1"
# 轻量级 Futures
futures-lite = "2.6"
# 轻量级异步运行时
smol = "2.0"
# 阻塞等待异步结果
pollster = "1.0.1"
# 响应式流
postage = { version = "0.5", features = ["futures-traits"] }

# ---- 序列化与数据格式 ----
# 序列化/反序列化框架
serde = { version = "1.0.229", features = ["derive", "rc"] }
# JSON 处理
serde_json = { version = "1.0.151", features = ["preserve_order", "raw_value"] }
# 宽松 JSON 解析
serde_json_lenient = { version = "0.2", features = ["preserve_order", "raw_value"] }
# URL 编码序列化
serde_urlencoded = "0.7"
# 保持插入顺序的哈希表
indexmap = { version = "2.14.1", features = ["serde"] }
# 高效句柄映射
slotmap = "1.1.1"
# 小数组优化的 Vec
smallvec = { version = "1.16", features = ["union", "const_new"] }
# 字节缓冲区
bytes = "1.12.1"

# ---- 时间日期 ----
# 日期时间处理
chrono = { version = "0.4", features = ["serde", "wasmbind"] }
# Web 平台时间 API
web-time = "1.1.0"

# ---- 日志、追踪与性能分析 ----
# 日志门面
log = { version = "0.4", features = ["kv_unstable_serde", "serde"] }
# 环境配置日志后端
env_logger = "0.11"
# 结构化追踪
tracing = "0.1"
# 性能分析宏
profiling = "1"
# 高动态范围直方图
hdrhistogram = "7"

# ---- 集合与迭代器 ----
# 扩展迭代器功能
itertools = "0.15.0"
# 数据并行
rayon = "1.12"

# ---- 字符串与文本 ----
# Unicode 文本分割
unicode-segmentation = "1.13"
# QR 码生成（rgpui qr-code feature，qr_code 组件）
qrcode = "0.14"
# 正则表达式
regex = "1.13"
# glob 模式匹配
globset = "0.4"
# shell 词法分析
shlex = "2.0.1"
# 流式读取直到分隔符
take-until = "0.2.0"
# Unicode 大小写不敏感比较
unicase = "2.9"
# URL 百分号编码
percent-encoding = "2.3.2"
# 枚举字符串工具
strum = { version = "0.28", features = ["derive"] }

# ---- 随机与测试 ----
# 随机数生成
rand = "0.10"
# 属性测试
#proptest = { git = "https://github.com/proptest-rs/proptest", rev = "3dca198a8fef1b32e3a66f1e1897c955b4dc5b5b", features = ["attr-macro"] }
proptest = { version = "1.11.0",features = ["attr-macro"] }
# 属性测试派生
proptest-derive = "0.8.0"
# 美观的断言差异
pretty_assertions = { version = "1.4.1", features = ["unstable"] }

# ---- 派生宏与代码生成 ----
# 构造函数宏
ctor = "1.0.13"
# 类型注册表
inventory = "0.3.24"
# 常用 trait 派生
derive_more = { version = "2.1.1", features = [
    "add",
    "add_assign",
    "deref",
    "deref_mut",
    "display",
    "from_str",
    "mul",
    "mul_assign",
    "not",
] }
# 栈安全检测
stacksafe = "1.0.3"

# ---- 并发与同步 ----
# 高性能锁
parking_lot = "0.12.5"

# ---- 位标志与标识符 ----
# 位标志宏
bitflags = "2.13.1"
# UUID 生成
uuid = { version = "1.26.0", features = ["v4", "v5", "v7", "serde"] }

# ---- 图像处理 ----
# 图像编解码
image = "0.25.10"
# 2D 图形解析（painting 示例）
lyon = { version = "1.0", features = ["extra"] }

# ---- 模式匹配与校验 ----
# JSON Schema 生成
schemars = { version = "1.2.2", features = ["indexmap2"] }

# ---- URL 处理 ----
# URL 解析
url = "2.5.8"

# ---- 屏幕捕获 ----
# 跨平台屏幕捕获
#scap = { git = "https://github.com/zed-industries/scap", rev = "4afea48c3b002197176fb19cd0f9b180dd36eaac", default-features = false, package = "zed-scap", version = "0.0.8-zed" }
scap = { package = "scap-rs", version = "0.1",default-features = false }

# ---- macOS 平台 ----
# WebAssembly 绑定
wasm-bindgen = "0.2.127"
# Cocoa 框架绑定
cocoa = "0.26.1"
# Cocoa 基础绑定
cocoa-foundation = "0.2.1"
# CoreFoundation 绑定
core-foundation = "0.10.1"
# CoreFoundation 系统接口
core-foundation-sys = "0.8.7"
# CoreVideo 绑定
core-video = { version = "=0.5.2", features = ["metal"] }
# Mach 内核接口
mach2 = "0.7"
# Metal GPU API 绑定
metal = "0.33"
# Objective-C 运行时
objc = "0.2"
# AppKit 绑定
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "NSGraphics",
    "NSButton",
    "NSView",
    "NSWindow",
    "NSControl",
    "NSResponder",
] }
# Foundation 框架绑定
objc2-foundation = { version = "=0.3.2", default-features = false, features = [
    "NSArray",
    "NSAttributedString",
    "NSBundle",
    "NSCoder",
    "NSData",
    "NSDate",
    "NSDictionary",
    "NSEnumerator",
    "NSError",
    "NSFormatter",
    "NSGeometry",
    "NSNotification",
    "NSNull",
    "NSObjCRuntime",
    "NSObject",
    "NSProcessInfo",
    "NSRange",
    "NSRunLoop",
    "NSString",
    "NSURL",
    "NSUndoManager",
    "NSValue",
    "objc2-core-foundation",
    "std",
] }

# ---- 哈希与映射 ----
# 编译器级快速哈希
rustc-hash = "2.1.3"

# ---- 过程宏工具 ----
# 命名风格转换
heck = "0.5"
# 过程宏 token 处理
proc-macro2 = "1.0.107"
# Rust 代码生成
quote = "1.0.47"
# Rust 源码解析
syn = { version = "3.0.4", features = ["full", "extra-traits", "visit-mut"] }

# ---- HTTP 网络 ----
# HTTP 类型
http = "1.5"
# HTTP Body trait
http-body = "1.1"

# ---- 文件与目录 ----
# 临时文件
tempfile = "3.27.0"
# 规范化路径
dunce = "1.0"
# 标准目录路径
dirs = "6.0"
# 递归目录遍历
walkdir = "2.5"
# 查找可执行文件
which = "8.0.6"
# 嵌入文件到二进制
rust-embed = { version = "8.12", features = ["include-exclude"] }

# ---- 加密与哈希 ----
# SHA-2 哈希
sha2 = "0.11"

# ---- Git ----
# Git 操作
git2 = { version = "0.21.0", default-features = false, features = ["vendored-libgit2"] }

# ---- 系统 ----
# C 标准库绑定
libc = "0.2"
# Unix API 绑定
nix = "0.31"
# 无堆分配容器
heapless = "0.9.3"

# ---- Linux 平台 ----
# Freedesktop Portal 接口
ashpd = { version = "0.13", default-features = false, features = [
    "async-io",
    "notification",
    "open_uri",
    "file_chooser",
    "settings",
    "trash"
] }

# ---- GPU 渲染 ----
# WebGPU 实现
wgpu = { version = "30.0" }
#wgpu = { git = "https://github.com/zed-industries/wgpu.git", rev = "357a0c56e0070480ad9daea5d2eaa83150b79e88" }

# ---- 版本语义 ----
# 语义化版本
semver = { version = "1.0", features = ["serde"] }

# ---- Windows 平台 ----
# Windows 核心类型
windows-core = "0.62"

# ---- Reqwest HTTP 客户端 ----
# HTTP 客户端
reqwest = { version = "0.13", features = ["json","charset","http2","multipart","socks","stream"] }

#reqwest = { git = "https://github.com/zed-industries/reqwest.git", rev = "c15662463bda39148ba154100dd44d3fba5873a4", default-features = false, features = [
#    "charset",
#    "http2",
#    "macos-system-configuration",
#    "multipart",
#    "rustls-tls-native-roots",
#    "socks",
#    "stream",
#], package = "zed-reqwest", version = "0.12.15-zed" }

# ---- Tokio 异步运行时 ----
# 异步运行时
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time"] }

# ---- TLS ----
# TLS 实现
rustls = { version = "0.23.43" }
# 平台证书验证
rustls-platform-verifier = "0.7.0"

criterion = { version = "0.8", features = ["html_reports"] }

lsp-types = { version = "0.97.0", features = ["proposed"] }

ropey = { version = "=2.0.0-beta.1", features = [
    "metric_lines_lf",
    "metric_utf16",
] }
serde_repr = "0.1"

portable-pty = "0.9"

alacritty_terminal = "0.26"
toml = "1.1"

# ---- 跨 crate 共享依赖 ----
# 窗口原始句柄抽象
raw-window-handle = "0.6"
# 字体布局与字形分配
etagere = "0.3"
# 零开销类型转换
bytemuck = "1"
# JavaScript互操作绑定
js-sys = "0.3"
# Web API绑定
web-sys = "0.3"
# 路径查找器几何运算
pathfinder_geometry = "0.5"
# 字体塑形与光栅化
swash = "0.2.10"
# macOS Core Graphics绑定
core-graphics = "0.25"
# macOS Core Text绑定
core-text = "22"
# Objective-C外部类型包装
foreign-types = "0.5"
# Objective-C block封装
block = "0.1"
# Objective-C2运行时绑定
objc2 = "0.6"
# WASM panic错误输出到控制台
console_error_panic_hook = "0.1.7"
# WASM Future桥接
wasm-bindgen-futures = "0.4"
# Windows原生菜单栏
muda = "0.19"
# Windows数值类型
windows-numerics = "0.3"
# Windows注册表操作
windows-registry = "0.5"
# 高性能多生产者多消费者通道
crossbeam-channel = "0.5"

