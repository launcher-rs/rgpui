[package]
name = "rgpui-markdown"
description = "rgpui 的 Markdown 渲染组件库：解析 Markdown 并渲染为富文本/表格/代码块等元素"
publish = true
license = "Apache-2.0"
version.workspace = true
edition.workspace = true
repository = "https://github.com/launcher-rs/rgpui"

[lints]
workspace = true

[features]
default = []
# LaTeX 公式渲染：解析 → 排版 → SVG → 光栅化（纯 Rust，无系统依赖）
latex = ["dep:ratex-parser", "dep:ratex-layout", "dep:ratex-svg"]
# Mermaid 图表渲染：SVG → 光栅化（纯 Rust，无系统依赖）
mermaid = ["dep:mermaid-rs-renderer"]
# 代码块真实语法高亮：接入核心 tree-sitter 高亮器（按语言查表，缺失时回退简易高亮）
syntax-highlight = ["rgpui/tree-sitter", "dep:ropey"]

[dependencies]
rgpui = { workspace = true }
pulldown-cmark = { workspace = true }
ratex-parser = { workspace = true, optional = true }
ratex-layout = { workspace = true, optional = true }
ratex-svg = { workspace = true, optional = true }
mermaid-rs-renderer = { workspace = true, optional = true }
ropey = { workspace = true, optional = true }

[dev-dependencies]
pollster = { workspace = true }
smol = { workspace = true }
