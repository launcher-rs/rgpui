[package]
name = "rgpui-linux"
version.workspace = true
edition.workspace = true
publish = true
description = "Linux 平台实现"
license = "Apache-2.0"
repository = "https://github.com/launcher-rs/rgpui"


[lints]
workspace = true

[lib]
path = "src/rgpui_linux.rs"

[features]
default = ["wayland", "x11"]
test-support = ["rgpui/test-support", "rgpui-wgpu?/test-support"]
wayland = [
    "bitflags",
    "rgpui-wgpu",
    "ashpd/wayland",

    "calloop-wayland-source",
    "wayland-backend",
    "wayland-client",
    "wayland-cursor",
    "wayland-protocols",
    "wayland-protocols-plasma",
    "wayland-protocols-wlr",
    "filedescriptor",
    "xkbcommon",
    "open",
    "rgpui/wayland",
]
x11 = [
    "rgpui-wgpu",
    "ashpd",

    "as-raw-xcb-connection",
    "x11rb",
    "xkbcommon",
    "xim",
    "x11-clipboard",
    "filedescriptor",
    "open",
    # 核心层的 X11 语义（后端选择、EWMH strut）都挂在这个 feature 上，
    # 不转发就会造出「平台是 X11、核心以为没有 X11」的组合
    "rgpui/x11",
    "scap?/x11",
]
screen-capture = [
    "rgpui/screen-capture",
    "scap",
]


[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
accesskit.workspace = true
accesskit_unix.workspace = true
anyhow.workspace = true
bytemuck.workspace = true
image.workspace = true
futures.workspace = true
rgpui.workspace = true
rgpui-wgpu = { workspace = true, optional = true, features = ["font-kit"] }
itertools.workspace = true
libc.workspace = true
log.workspace = true
parking_lot.workspace = true
pathfinder_geometry.workspace = true
pollster.workspace = true
profiling.workspace = true
smallvec.workspace = true
smol.workspace = true
strum.workspace = true
url.workspace = true
uuid = { workspace = true, features = ["v5"] }

# Always used
oo7 = { version = "0.7.3", default-features = false, features = [
    "async-std",
    "native_crypto",
] }
calloop = "0.14.5"
raw-window-handle.workspace = true

# Used in both windowing options
ashpd = { workspace = true, optional = true }
swash.workspace = true
bitflags = { workspace = true, optional = true }
filedescriptor = { version = "0.8.3", optional = true }
open = { version = "5.4.5", optional = true }
xkbcommon = { version = "0.9.0", features = ["wayland", "x11"], optional = true }

# Screen capture
scap = { workspace = true, optional = true }

# Wayland
calloop-wayland-source = { version = "0.4.1", optional = true }
wayland-backend = { version = "0.3.17", features = [
    "client_system",
    "dlopen",
], optional = true }
wayland-client = { version = "0.31.15", optional = true }
wayland-cursor = { version = "0.31.14", optional = true }
wayland-protocols = { version = "0.32.13", features = [
    "client",
    "staging",
    "unstable",
], optional = true }
wayland-protocols-plasma = { version = "0.3.12", features = [
    "client",
], optional = true }
wayland-protocols-wlr = { version = "0.3.12", features = [
    "client",
], optional = true }

# X11
as-raw-xcb-connection = { version = "1.0.1", optional = true }
x11rb = { version = "0.14.0", features = [
    "allow-unsafe-code",
    "xkb",
    "randr",
    "xinput",
    "cursor",
    "resource_manager",
    "sync",
    "dri3",
    "shape",
], optional = true }
xim = { features = [
    "x11rb-xcb",
    "x11rb-client",
], package = "rgpui-xim", version = "0.5.0", optional = true }
x11-clipboard = { version = "0.9.3", optional = true }
