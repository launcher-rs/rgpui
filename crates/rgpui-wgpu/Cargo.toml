[package]
name = "rgpui-wgpu"
version.workspace = true
edition.workspace = true
publish = true
description = "wgpu 渲染后端"
license = "Apache-2.0"
repository = "https://github.com/launcher-rs/rgpui"

[lints]
workspace = true

[lib]
path = "src/rgpui_wgpu.rs"

[features]
default = []
font-kit = ["dep:font-kit"]
# 无头渲染器要实现核心层的 PlatformHeadlessRenderer，那个 trait 本身挂在这个 feature 上
test-support = ["rgpui/test-support"]

[dependencies]
rgpui.workspace = true
anyhow.workspace = true
bytemuck.workspace = true
cosmic-text = "0.19.0"
etagere.workspace = true
image.workspace = true
itertools.workspace = true
log.workspace = true
parking_lot.workspace = true
profiling.workspace = true
raw-window-handle.workspace = true
smallvec.workspace = true
swash.workspace = true
wgpu.workspace = true
unicode-segmentation.workspace = true
unicode-bidi = "0.3.18"

# Optional: only needed on platforms with multiple font sources (e.g. Linux)
font-kit = { package = "rgpui-font-kit", version = "0.14.2", optional = true }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
pollster.workspace = true

[target.'cfg(target_family = "wasm")'.dependencies]
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
web-sys = { workspace = true, features = ["HtmlCanvasElement"] }
js-sys.workspace = true

indexmap.workspace = true
rustc-hash.workspace = true

[dev-dependencies]
criterion.workspace = true

[[bench]]
name = "layout_line"
harness = false
