[package]
name = "rgpui-macos"
version.workspace = true
edition.workspace = true
publish = true
description = "macOS 平台实现"
license = "Apache-2.0"
repository = "https://github.com/launcher-rs/rgpui"

[lints]
workspace = true

[lib]
path = "src/rgpui_macos.rs"

[features]
default = ["rgpui/default"]
test-support = ["rgpui/test-support"]
runtime_shaders = []
font-kit = ["dep:font-kit"]
screen-capture = ["rgpui/screen-capture"]

[dependencies]
rgpui.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
accesskit.workspace = true
accesskit_macos.workspace = true
anyhow.workspace = true
async-task.workspace = true
bitflags.workspace = true
core-foundation.workspace = true
core-foundation-sys.workspace = true
core-graphics.workspace = true
core-text.workspace = true
core-video.workspace = true
ctor.workspace = true
derive_more.workspace = true
dispatch2 = "0.3.1"
etagere.workspace = true
font-kit = { git = "https://github.com/zed-industries/font-kit", rev = "94b0f28166665e8fd2f53ff6d268a14955c82269", package = "zed-font-kit", version = "0.14.1-zed", optional = true }
foreign-types.workspace = true
futures.workspace = true
image.workspace = true
itertools.workspace = true
libc.workspace = true
log.workspace = true
mach2.workspace = true
metal.workspace = true
cocoa.workspace = true
block.workspace = true
objc.workspace = true
objc2.workspace = true
objc2-app-kit.workspace = true
objc2-foundation.workspace = true
parking_lot.workspace = true
pathfinder_geometry.workspace = true
raw-window-handle.workspace = true
semver.workspace = true
smallvec.workspace = true
strum.workspace = true
uuid.workspace = true

[target.'cfg(target_os = "macos")'.build-dependencies]
bindgen = "0.72"
cbindgen = { version = "0.29.4", default-features = false }
rgpui.workspace = true

# When this crate is itself being tested (cargo test -p rgpui_macos), its own
# cfg(test) flag enables impls of test-only traits like PlatformHeadlessRenderer
# and PlatformWindow::render_to_image. Those traits/methods only exist in rgpui
# when rgpui's `test-support` feature is on, so we have to turn that feature on
# as a dev-dependency. The `cfg(test)` flag of a dependent crate doesn't
# propagate to its dependencies, but dev-dependencies do, so this is the
# correct way to enable the feature exactly when needed.
[target.'cfg(target_os = "macos")'.dev-dependencies]
rgpui = { workspace = true, features = ["test-support"] }
