[package]
name = "rgpui-cli"
version = "1.4.0"
edition = "2024"
publish = false
description = "rgpui 移动端开发 CLI：环境检查 / 项目创建 / 一键构建部署"

[[bin]]
name = "rgpui"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1.0"
console = "0.15"
dialoguer = "0.11"
include_dir = "0.7"
