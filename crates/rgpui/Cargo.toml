[package]
name = "rgpui"
version.workspace = true
edition.workspace = true
description = "GUI UI framework"
publish = true
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/launcher-rs/rgpui"
keywords = ["desktop", "gui", "immediate"]
categories = ["gui"]


[lints]
workspace = true

[features]
# 默认特性集合：macOS 字体回退栈 font-kit、Linux 的 Wayland/X11 平台后端、
# Windows 应用清单嵌入。
default = ["font-kit", "wayland", "x11", "windows-manifest"]
# 测试支持：启用泄漏检测、proptest 属性测试、假 HTTP 客户端（FakeHttpClient）
# 与 visual_test（macOS 截图对比测试），并启用 Wayland/X11 与 git2 依赖。
test-support = [
    "leak-detection",
    "wayland",
    "x11",
    "proptest",
    "dep:git2",
]
# 元素检查器：为元素/窗口附加调试信息（默认 debug_assertions 下也启用）。
inspector = ["rgpui-macros/inspector"]
# 实体（Entity）内存泄漏检测：测试与 test-support 下跟踪实体分配与释放。
leak-detection = []
# HTTP 客户端：启用基于 reqwest 的 HttpClient 实现（非 wasm 目标）。
reqwest = [
    "dep:reqwest",
    "dep:tokio",
]
# TLS 支持：为 reqwest 客户端启用 rustls 平台证书校验（含系统根证书）。
tls = [
    "dep:rustls",
    "dep:rustls-platform-verifier",
]
# Linux Wayland 平台后端。
wayland = []
# Linux X11 平台后端（scap 屏幕捕获可选启用 X11 支持）。
x11 = [
    "scap?/x11",
]
# 屏幕捕获：启用 PlatformScreenCaptureFrame 与 scap 后端（Windows/Linux），
# macOS 使用 core-video 实现。
screen-capture = [
    "scap",
]
# Windows 应用清单：通过 embed-resource 嵌入 windows.manifest 等资源。
windows-manifest = ["dep:embed-resource"]
# 输入延迟直方图：用 hdrhistogram 统计窗口输入事件处理延迟。
input-latency-histogram = []
# 内嵌额外主题表（自 rgpui-component 主题整合而来，37 套，约 178KB）。
# 默认关闭以保持核心二进制精简，需要多主题的应用程序可显式开启。
bundled-themes = []
# 图表组件（自 rgpui-ui 并入，11 个图，自成体系）。默认关闭。
charts = []
# 纯装饰特效组件（aurora/confetti/particle_emitter/ripple/shimmer/marquee/pulse_indicator）。
# 默认关闭，非核心功能。
effects = []
# 二维码组件（引入 qrcode 依赖）。默认关闭。
qr-code = ["dep:qrcode"]
# Tokio 异步运行时集成（自 rgpui-tokio 并入，约 120 行薄封装）。
# 默认关闭以保持核心精简，需要 tokio 异步能力的应用可显式开启。
tokio = ["dep:tokio"]

[lib]
path = "src/rgpui.rs"
doctest = false

[dependencies]
accesskit = { workspace = true, features = ["enumn"] }
anyhow.workspace = true
async-task = "4.7"
backtrace.workspace = true
bitflags.workspace = true

ctor.workspace = true
dirs.workspace = true
derive_more.workspace = true
rgpui-macros.workspace = true
etagere = "0.2"
futures.workspace = true
futures-concurrency.workspace = true
image.workspace = true
inventory.workspace = true
indexmap.workspace = true
itertools.workspace = true
log.workspace = true
num_cpus = "1.13"
once_cell = "1.19.0"
parking = "2.0.0"
parking_lot.workspace = true
postage.workspace = true
proptest = { workspace = true, optional = true }
chrono.workspace = true
profiling.workspace = true
rand.workspace = true
raw-window-handle = "0.6"
regex.workspace = true
rustc-hash.workspace = true
resvg = { version = "0.45.0", default-features = false, features = [
    "text",
    "system-fonts",
    "memmap-fonts",
    "raster-images"
] }
usvg = { version = "0.45.0", default-features = false }
ttf-parser = "0.25"
schemars.workspace = true
seahash = "4.1"
serde.workspace = true
serde_json.workspace = true
serde_repr = "0.1"
slotmap.workspace = true
smallvec.workspace = true
smol_str = "0.3.6"
async-channel.workspace = true

bytes.workspace = true
dunce.workspace = true
flume = "0.11"
futures-lite.workspace = true
git2 = { workspace = true, optional = true }
globset.workspace = true
heapless.workspace = true
http.workspace = true
http-body.workspace = true
percent-encoding.workspace = true
reqwest = { workspace = true, optional = true }
rust-embed.workspace = true
rustls = { workspace = true, optional = true }
rustls-platform-verifier = { workspace = true, optional = true }
serde_json_lenient.workspace = true
serde_urlencoded.workspace = true
sha2.workspace = true
shlex.workspace = true
take-until.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "time"], optional = true }
tracing.workspace = true
unicase.workspace = true
stacksafe.workspace = true
strum.workspace = true
taffy = "=0.10.1"
thiserror.workspace = true
hdrhistogram = { workspace = true }
waker-fn = "1.2.0"
lyon = "1.0"
pin-project = "1.1.10"
spin = "0.10.0"
pollster.workspace = true
paste = "1"
url.workspace = true
uuid.workspace = true
web-time.workspace = true
ropey.workspace = true
instant = { version = "0.1", features = ["wasm-bindgen"] }
unicode-segmentation = { workspace = true }
qrcode = { workspace = true, optional = true }

[target.'cfg(target_family = "wasm")'.dependencies]
getrandom = { version = "0.4.3", features = ["wasm_js"] }
uuid = { workspace = true, features = ["js"] }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
