[package]
name = "rgpui-android"
version.workspace = true
edition.workspace = true
publish = true
description = "Android 平台实现（1.4.0 移动端，Android 优先）"
license = "Apache-2.0"
repository = "https://github.com/launcher-rs/rgpui"

[lints]
workspace = true

[lib]
path = "src/rgpui_android.rs"

[features]
default = []

[dependencies]
rgpui.workspace = true
rgpui-wgpu.workspace = true
anyhow.workspace = true
futures.workspace = true
log.workspace = true
parking_lot.workspace = true
raw-window-handle.workspace = true
uuid.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
# 仅供 Windows 主机编译桩窗口的 get_raw_handle 签名，真机不用。
windows = { workspace = true }

[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6", features = ["native-activity"] }
android_logger = "0.15"
jni = "0.22"
libc.workspace = true
ndk = { version = "0.9", features = ["nativewindow"] }
ndk-context = "0.1"
ndk-sys = "0.6"
