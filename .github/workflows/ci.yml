name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [dev, main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - macos-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          # azure.archive.ubuntu.com 镜像在 GitHub 托管 runner 上经常不可达，导致 apt-get update 无限重试卡死。
          # Ubuntu 24.04 通过 /etc/apt/apt-mirrors.txt（Mirrorlist）选择镜像，需将其替换为可用的
          # archive.ubuntu.com；同时修复旧式 sources 文件，并强制 IPv4、设置获取超时避免再次挂起。
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            echo "http://archive.ubuntu.com/ubuntu/" | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          fi
          sudo sed -i 's|azure\.archive\.ubuntu\.com|archive.ubuntu.com|g' /etc/apt/sources.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          printf 'Acquire::ForceIPv4 "true";\nAcquire::http::Timeout "30";\nAcquire::Retries "5";\n' | sudo tee /etc/apt/apt.conf.d/99-github-runner >/dev/null
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            clang \
            libfontconfig1-dev \
            libglib2.0-dev \
            libgtk-3-dev \
            libjavascriptcoregtk-4.1-dev \
            libwebkit2gtk-4.1-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev

      - name: cargo fmt
        shell: bash
        run: |
          # rgpui-linux 的 Rust 2024 edition 语法在 stable rustfmt 下解析会失败，逐 crate 检查并跳过它
          for crate in rgpui rgpui-3d rgpui-character rgpui-dom rgpui-macros rgpui-markdown rgpui-platform rgpui-term rgpui-web rgpui-wgpu rgpui-windows; do
            cargo fmt -p "$crate" -- --check
          done

      - name: cargo clippy
        run: cargo clippy --workspace --lib --bins -- -D warnings

      - name: cargo check
        run: cargo check --workspace

      - name: cargo check (examples)
        run: cargo check --workspace --examples

      - name: cargo check (examples workspace)
        working-directory: examples
        run: cargo check --workspace

      - name: cargo test
        run: cargo test --workspace

