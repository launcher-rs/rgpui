name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [dev, main]

# 同一分支的推送和 PR 共用一个组，后到的取消先到的。
# 注意不能用 github.ref：PR 事件里它是 refs/pull/N/merge，和 push 的
# refs/heads/分支 对不上，改用 head_ref（PR 源分支）|| ref_name（push 分支）。
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - macos-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          # azure.archive.ubuntu.com 镜像在 GitHub 托管 runner 上经常不可达，导致 apt-get update 无限重试卡死。
          # Ubuntu 24.04 通过 /etc/apt/apt-mirrors.txt（Mirrorlist）选择镜像，需将其替换为可用的
          # archive.ubuntu.com；同时修复旧式 sources 文件，并强制 IPv4、设置获取超时避免再次挂起。
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            echo "http://archive.ubuntu.com/ubuntu/" | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          fi
          sudo sed -i 's|azure\.archive\.ubuntu\.com|archive.ubuntu.com|g' /etc/apt/sources.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          printf 'Acquire::ForceIPv4 "true";\nAcquire::http::Timeout "30";\nAcquire::Retries "5";\n' | sudo tee /etc/apt/apt.conf.d/99-github-runner >/dev/null
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            clang \
            libfontconfig1-dev \
            libglib2.0-dev \
            libgtk-3-dev \
            libjavascriptcoregtk-4.1-dev \
            libwebkit2gtk-4.1-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev

      - name: cargo fmt
        shell: bash
        run: |
          # rgpui-linux 的 Rust 2024 edition 语法在 stable rustfmt 下解析会失败，逐 crate 检查并跳过它
          for crate in rgpui rgpui-3d rgpui-android rgpui-character rgpui-dom rgpui-ios rgpui-macros rgpui-markdown rgpui-platform rgpui-term rgpui-web rgpui-wgpu rgpui-windows; do
            cargo fmt -p "$crate" -- --check
          done

      - name: cargo clippy
        run: cargo clippy --workspace --lib --bins -- -D warnings

      - name: cargo check
        run: cargo check --workspace

      - name: cargo check (examples)
        run: cargo check --workspace --examples

      - name: cargo check (examples workspace)
        working-directory: examples
        run: cargo check --workspace

      - name: cargo test
        run: cargo test --workspace

  # 1.4.0 移动端：只查编译（cargo check）+ 主机单测，不跑 GPU 单测
  # （runner 软件渲染，真机行为以 adb 实测为准）。
  # 注意：iOS target 的依赖链含 psm（构建脚本要调 xcrun），只能在 macOS
  # runner 上 check；Android check 在 ubuntu 上即可。APK 组装见 android-apk。
  mobile-android:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2

      - name: cargo check (android lib)
        run: cargo check -p rgpui-android --target aarch64-linux-android

      - name: cargo check (example android)
        run: cargo check -p hello_mobile --target aarch64-linux-android

      - name: cargo test (mobile crates, host)
        run: cargo test -p rgpui-platform -p rgpui-android -p rgpui-ios

  # 1.4.0 APK 组装（cargo-ndk + Gradle + artifact 上传）；
  # 打包步骤见 docs/1.4.0/android-guide.md §8。
  android-apk:
    runs-on: ubuntu-latest
    needs: mobile-android

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Set up Android SDK + NDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          # action 默认含已废弃的 "tools" 包，sdkmanager 会失败，只装 platform-tools。
          packages: platform-tools

      - name: Resolve NDK path
        run: echo "ANDROID_NDK_HOME=$ANDROID_NDK_ROOT" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build Rust shared library via cargo-ndk
        # cargo-ndk 4.x 平台 flag 是大写 -P（小写会被当包名）。
        run: >
          cargo ndk -t arm64-v8a -P 31
          -o examples/hello_mobile/android/app/src/main/jniLibs
          build -p hello_mobile

      - name: Strip debug symbols
        # 未 strip 的 debug .so 约 500MB，strip 后 ~75MB（见 android-guide §8）。
        run: |
          strip_bin="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"
          "$strip_bin" --strip-debug examples/hello_mobile/android/app/src/main/jniLibs/arm64-v8a/libhello_mobile.so

      - name: Assemble debug APK
        working-directory: examples/hello_mobile/android
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: hello-mobile-debug.apk
          path: examples/hello_mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

  mobile-ios:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - uses: Swatinem/rust-cache@v2

      - name: cargo check (ios lib)
        run: cargo check -p rgpui-ios --target aarch64-apple-ios

      - name: cargo check (example ios)
        run: cargo check -p hello_mobile --target aarch64-apple-ios

